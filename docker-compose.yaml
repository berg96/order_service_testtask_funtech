volumes:
  pg_data:
  redis_data:

services:
  postgres_db:
    image: postgres
    env_file: .env
    ports:
      - '5432:5432'
    volumes:
      - pg_data://var/lib/postgresql

  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "bash", "-c", "nc -z localhost 29092" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  faststream-service:
    build:
      context: ./faststream_service
    env_file: ./faststream_service/.env
    restart: unless-stopped
    depends_on:
      - redis
      - kafka

  celery-worker:
    build:
      context: ./faststream_service
    env_file: ./faststream_service/.env
    command: celery -A faststream_app.infrastructure.tasks.celery_app.celery_app worker --loglevel=info
    depends_on:
      - redis

  app:
    build:
      context: .
    env_file: .env
    depends_on:
      - postgres_db
      - redis
      - kafka
    restart: always
    ports:
      - '8000:8000'
